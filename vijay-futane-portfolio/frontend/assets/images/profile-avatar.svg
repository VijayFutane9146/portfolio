<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Matrix / Binary grid lines in background -->
  <g opacity="0.15" stroke="#a855f7" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- Ambient Light Halo -->
  <circle cx="200" cy="180" r="130" fill="#a855f7" opacity="0.25" filter="url(#neonGlow)"/>
  <circle cx="210" cy="190" r="90" fill="#06b6d4" opacity="0.2" filter="url(#neonGlow)"/>

  <!-- Developer Character Vector -->
  <!-- Shoulders & Blazer -->
  <path d="M 100 400 C 100 320, 140 280, 200 280 C 260 280, 300 320, 300 400 Z" fill="url(#suitGrad)"/>
  
  <!-- Shirt collar -->
  <polygon points="175,280 200,340 225,280 200,295" fill="#f8fafc"/>
  
  <!-- Modern Violet Tie -->
  <polygon points="195,295 205,295 210,380 200,395 190,380" fill="url(#tieGrad)"/>
  
  <!-- Lapels -->
  <polygon points="140,285 175,370 190,370 160,285" fill="#2e1065" opacity="0.8"/>
  <polygon points="260,285 225,370 210,370 240,285" fill="#2e1065" opacity="0.8"/>

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="60" rx="10" fill="#d97706" opacity="0.85"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="185" rx="60" ry="72" fill="#fbbf24"/>
  <path d="M 140 180 C 140 250, 260 250, 260 180 Z" fill="#f59e0b" opacity="0.25"/>

  <!-- Modern Hair Style -->
  <path d="M 136 175 C 130 110, 160 80, 210 80 C 255 80, 272 105, 264 165 C 250 150, 240 145, 220 145 C 190 145, 170 155, 136 175 Z" fill="url(#hairGrad)"/>
  
  <!-- Ears -->
  <ellipse cx="140" cy="188" rx="8" ry="14" fill="#f59e0b"/>
  <ellipse cx="260" cy="188" rx="8" ry="14" fill="#f59e0b"/>

  <!-- Smart Developer Glasses (Rimless / Neon tint) -->
  <g stroke="#06b6d4" stroke-width="3" fill="rgba(6, 182, 212, 0.15)">
    <rect x="152" y="172" width="38" height="26" rx="6"/>
    <rect x="210" y="172" width="38" height="26" rx="6"/>
    <line x1="190" y1="185" x2="210" y2="185"/>
    <line x1="140" y1="180" x2="152" y2="183"/>
    <line x1="248" y1="183" x2="260" y2="180"/>
  </g>

  <!-- Eyes behind glasses -->
  <circle cx="171" cy="185" r="4" fill="#0f172a"/>
  <circle cx="173" cy="183" r="1.5" fill="#ffffff"/>
  <circle cx="229" cy="185" r="4" fill="#0f172a"/>
  <circle cx="231" cy="183" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M 155 166 Q 170 162 188 166" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 212 166 Q 230 162 245 166" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Confident Smile -->
  <path d="M 185 224 Q 200 236 215 224" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Floating Code Badges / Tech Orbs -->
  <g transform="translate(45, 95)" filter="url(#neonGlow)">
    <rect width="60" height="28" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="30" y="18" fill="#c084fc" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;code/&gt;</text>
  </g>

  <g transform="translate(295, 115)" filter="url(#neonGlow)">
    <rect width="65" height="28" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="32" y="18" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">SQL::DB</text>
  </g>
</svg>

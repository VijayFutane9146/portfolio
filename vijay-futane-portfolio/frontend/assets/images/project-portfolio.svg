<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140728"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="reactCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad3)"/>

  <!-- Window Bar -->
  <rect x="0" y="0" width="600" height="42" fill="#1b0e36" rx="16"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="300" y="26" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">React &amp; Flask Microservices Architecture</text>

  <!-- Central React Atom & Glass Showcase -->
  <g transform="translate(160, 60)">
    <!-- Rotating Orbits -->
    <ellipse cx="140" cy="120" rx="120" ry="42" fill="none" stroke="#61dafb" stroke-width="2.5" opacity="0.8" transform="rotate(30 140 120)"/>
    <ellipse cx="140" cy="120" rx="120" ry="42" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.8" transform="rotate(90 140 120)"/>
    <ellipse cx="140" cy="120" rx="120" ry="42" fill="none" stroke="#ec4899" stroke-width="2.5" opacity="0.8" transform="rotate(150 140 120)"/>
    
    <!-- Central Core -->
    <circle cx="140" cy="120" r="18" fill="#61dafb"/>
    <circle cx="140" cy="120" r="10" fill="#ffffff"/>
  </g>

  <!-- Left Code Mockup Card -->
  <g transform="translate(30, 80)">
    <rect width="180" height="230" rx="12" fill="rgba(25, 15, 45, 0.85)" stroke="rgba(168, 85, 247, 0.4)"/>
    <text x="16" y="30" fill="#a855f7" font-family="'Fira Code', monospace" font-size="11">const Portfolio = () =&gt; {</text>
    <text x="26" y="55" fill="#60a5fa" font-family="'Fira Code', monospace" font-size="10">const [data, set] =</text>
    <text x="36" y="75" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">useState(null);</text>
    <text x="26" y="105" fill="#f472b6" font-family="'Fira Code', monospace" font-size="10">useEffect(() =&gt; {</text>
    <text x="36" y="125" fill="#34d399" font-family="'Fira Code', monospace" font-size="10">fetch('/api/stats')</text>
    <text x="36" y="145" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="10">.then(res =&gt; ...)</text>
    <text x="26" y="170" fill="#f472b6" font-family="'Fira Code', monospace" font-size="10">}, []);</text>
    <text x="16" y="200" fill="#a855f7" font-family="'Fira Code', monospace" font-size="11">};</text>
  </g>

  <!-- Right Architecture Flow Card -->
  <g transform="translate(390, 80)">
    <rect width="180" height="230" rx="12" fill="rgba(25, 15, 45, 0.85)" stroke="rgba(6, 182, 212, 0.4)"/>
    <text x="18" y="30" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold">System Flow</text>

    <!-- Node 1: React -->
    <rect x="20" y="50" width="140" height="34" rx="6" fill="#1e1035" stroke="#61dafb"/>
    <text x="90" y="72" fill="#e2e8f0" font-size="10" text-anchor="middle">React 18 Frontend</text>

    <!-- Arrow -->
    <line x1="90" y1="84" x2="90" y2="104" stroke="#a855f7" stroke-width="2"/>
    <polygon points="90,108 86,102 94,102" fill="#a855f7"/>

    <!-- Node 2: Flask -->
    <rect x="20" y="110" width="140" height="34" rx="6" fill="#1e1035" stroke="#a855f7"/>
    <text x="90" y="132" fill="#e2e8f0" font-size="10" text-anchor="middle">Flask REST APIs</text>

    <!-- Arrow -->
    <line x1="90" y1="144" x2="90" y2="164" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="90,168 86,162 94,162" fill="#06b6d4"/>

    <!-- Node 3: MySQL -->
    <rect x="20" y="170" width="140" height="34" rx="6" fill="#1e1035" stroke="#06b6d4"/>
    <text x="90" y="192" fill="#e2e8f0" font-size="10" text-anchor="middle">MySQL Relational DB</text>
  </g>
</svg>

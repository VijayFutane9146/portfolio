<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 30, 54, 0.8)"/>
      <stop offset="100%" stop-color="rgba(10, 20, 38, 0.9)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Window Bar -->
  <rect x="0" y="0" width="600" height="42" fill="#0b213f" rx="16"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="300" y="26" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Power Grid Telemetry &amp; Energy Optimization</text>

  <!-- Left Telemetry Gauge -->
  <g transform="translate(30, 65)">
    <rect width="250" height="290" rx="12" fill="url(#cardGrad2)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="24" y="32" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">Peak Load Efficiency</text>
    
    <!-- Circular Gauge -->
    <circle cx="125" cy="140" r="70" fill="none" stroke="#1e293b" stroke-width="14"/>
    <circle cx="125" cy="140" r="70" fill="none" stroke="#06b6d4" stroke-width="14" stroke-dasharray="440" stroke-dashoffset="110" stroke-linecap="round"/>
    
    <text x="125" y="142" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" text-anchor="middle">94.2%</text>
    <text x="125" y="165" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Optimal Stability</text>

    <!-- Sub Metrics -->
    <rect x="24" y="225" width="95" height="45" rx="6" fill="#0f172a"/>
    <text x="32" y="242" fill="#94a3b8" font-size="9">Current Draw</text>
    <text x="32" y="260" fill="#38bdf8" font-size="13" font-weight="bold">1.42 MW</text>

    <rect x="131" y="225" width="95" height="45" rx="6" fill="#0f172a"/>
    <text x="139" y="242" fill="#94a3b8" font-size="9">Carbon Saved</text>
    <text x="139" y="260" fill="#10b981" font-size="13" font-weight="bold">-28.4%</text>
  </g>

  <!-- Right Bar Charts -->
  <g transform="translate(300, 65)">
    <rect width="270" height="290" rx="12" fill="url(#cardGrad2)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="20" y="32" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">Hourly Distribution (kWh)</text>

    <!-- Grid bars -->
    <g transform="translate(30, 80)">
      <!-- Bar 1 -->
      <rect x="0" y="100" width="22" height="70" rx="4" fill="url(#barGrad)"/>
      <text x="11" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">02h</text>
      <!-- Bar 2 -->
      <rect x="35" y="70" width="22" height="100" rx="4" fill="url(#barGrad)"/>
      <text x="46" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">06h</text>
      <!-- Bar 3 -->
      <rect x="70" y="30" width="22" height="140" rx="4" fill="url(#barGrad)"/>
      <text x="81" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">10h</text>
      <!-- Bar 4 (Peak) -->
      <rect x="105" y="10" width="22" height="160" rx="4" fill="#a855f7"/>
      <text x="116" y="185" fill="#a855f7" font-size="10" font-weight="bold" text-anchor="middle">14h</text>
      <!-- Bar 5 -->
      <rect x="140" y="45" width="22" height="125" rx="4" fill="url(#barGrad)"/>
      <text x="151" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">18h</text>
      <!-- Bar 6 -->
      <rect x="175" y="85" width="22" height="85" rx="4" fill="url(#barGrad)"/>
      <text x="186" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">22h</text>
    </g>

    <!-- Bottom summary status -->
    <g transform="translate(20, 240)">
      <rect width="230" height="32" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
      <circle cx="16" cy="16" r="4" fill="#10b981"/>
      <text x="28" y="20" fill="#6ee7b7" font-size="11">Predictive AI: No anomalies detected</text>
    </g>
  </g>
</svg>

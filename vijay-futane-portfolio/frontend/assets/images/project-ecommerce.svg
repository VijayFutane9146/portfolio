<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1026"/>
      <stop offset="100%" stop-color="#181339"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(33, 27, 72, 0.8)"/>
      <stop offset="100%" stop-color="rgba(19, 16, 43, 0.9)"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Top App Window Bar -->
  <rect x="0" y="0" width="600" height="42" fill="#14112e" rx="16"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="21" r="6" fill="#10b981"/>
  <text x="300" y="26" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">E-commerce Analytics &amp; Revenue Operations</text>

  <!-- Left Sidebar Mini -->
  <rect x="20" y="60" width="60" height="300" rx="10" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.2)"/>
  <circle cx="50" cy="90" r="14" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="50" cy="130" r="10" fill="#64748b" opacity="0.4"/>
  <circle cx="50" cy="170" r="10" fill="#64748b" opacity="0.4"/>
  <circle cx="50" cy="210" r="10" fill="#64748b" opacity="0.4"/>
  <circle cx="50" cy="330" r="12" fill="#06b6d4" opacity="0.5"/>

  <!-- Top Metric Cards -->
  <!-- Card 1: Revenue -->
  <g transform="translate(100, 60)">
    <rect width="145" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.25)"/>
    <text x="14" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total Revenue</text>
    <text x="14" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold">$148,290</text>
    <text x="14" y="64" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">▲ +24.8% vs last mo</text>
  </g>

  <!-- Card 2: Orders -->
  <g transform="translate(260, 60)">
    <rect width="145" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.25)"/>
    <text x="14" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Active Orders</text>
    <text x="14" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold">3,842</text>
    <text x="14" y="64" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">▲ +12.4% conversion</text>
  </g>

  <!-- Card 3: Customers -->
  <g transform="translate(420, 60)">
    <rect width="160" height="75" rx="10" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.25)"/>
    <text x="14" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Avg Order Value</text>
    <text x="14" y="48" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold">$86.40</text>
    <text x="14" y="64" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">● Real-time synced</text>
  </g>

  <!-- Main Chart Section -->
  <g transform="translate(100, 150)">
    <rect width="480" height="210" rx="12" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.25)"/>
    <text x="20" y="28" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Sales Trend &amp; Growth Trajectory</text>
    
    <!-- Chart Grid Lines -->
    <line x1="20" y1="60" x2="460" y2="60" stroke="#332a63" stroke-dasharray="4"/>
    <line x1="20" y1="105" x2="460" y2="105" stroke="#332a63" stroke-dasharray="4"/>
    <line x1="20" y1="150" x2="460" y2="150" stroke="#332a63" stroke-dasharray="4"/>
    <line x1="20" y1="180" x2="460" y2="180" stroke="#4c3d82"/>

    <!-- Chart Fill Area -->
    <path d="M 20 180 L 20 140 Q 80 110 140 130 T 260 90 T 360 115 T 460 40 L 460 180 Z" fill="url(#chartGrad)"/>
    
    <!-- Neon Chart Line -->
    <path d="M 20 140 Q 80 110 140 130 T 260 90 T 360 115 T 460 40" fill="none" stroke="#a855f7" stroke-width="3.5"/>
    
    <!-- Data Points -->
    <circle cx="140" cy="130" r="5" fill="#f8fafc" stroke="#a855f7" stroke-width="2"/>
    <circle cx="260" cy="90" r="5" fill="#f8fafc" stroke="#a855f7" stroke-width="2"/>
    <circle cx="460" cy="40" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
